name: Quality Checks
on:
  pull_request:
    branches: [develop]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: TypeScript, Tests & Linting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type checking
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:run

      - name: Run linting
        run: npm run lint

      - name: Build project
        run: npm run build